  bugs: benchmark/known_bugs/validated_count_bugs.py
  tests: benchmark/tests/test_tier3.py

- id: empty_dataset_count_v1
  tier: 3
  family: edge_case
  function_name: private_count_safe
  claimed_epsilon: 1.0
  claimed_delta: 0.0
  adjacency: add_remove_one
  spec: |
    Write one self-contained Python function named `private_count_safe`.
    - Input: `data`, a list of integers each 0 or 1, WHICH MAY BE EMPTY;
